<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossiers huisartsenpraktijken</title>
<meta name="description" content="Overzicht van drie fictieve huisartsenpraktijken: visie, teamcompositie en patiëntenpopulatie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #dfe5e8;
    --desk-dark: #cdd6db;
    --ink: #1c2a32;
    --ink-soft: #4a5b65;
    --paper: #fbfcfc;
    --line: #c3cdd3;
    --focus: #0b57d0;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --text: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #1a2329;
      --desk-dark: #232f36;
      --ink: #e8eef1;
      --ink-soft: #a5b4bc;
      --paper: #26333b;
      --line: #3a4a54;
      --focus: #8ab4f8;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--desk);
    color: var(--ink);
    font-family: var(--text);
    font-size: 1.0625rem;
    line-height: 1.65;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0 0 1em; max-width: 68ch; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* ---------- Landingspagina ---------- */
  .landing { max-width: 1100px; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
  .landing h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 700; max-width: 16ch; }
  .landing .intro { margin-top: 1.25rem; color: var(--ink-soft); font-size: 1.15rem; max-width: 52ch; }

  .cabinet {
    margin-top: 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 3.5rem 2rem;
  }

  .folder {
    --c: #2f6f73;
    position: relative;
    display: block;
    text-decoration: none;
    padding-top: 2.1rem;
    isolation: isolate;
  }
  /* tabblad van de map */
  .folder::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 46%; height: 2.6rem;
    background: var(--c);
    border-radius: 12px 12px 0 0;
    clip-path: polygon(0 0, 86% 0, 100% 100%, 0 100%);
    z-index: -1;
  }
  /* papier dat uit de map steekt */
  .folder .sheet {
    position: absolute;
    left: 1rem; right: 1rem; top: 1.2rem;
    height: 5rem;
    background: var(--paper);
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--line);
    transition: transform .25s ease;
    z-index: -1;
  }
  .folder .body {
    position: relative;
    background: var(--c);
    color: #fff;
    border-radius: 0 12px 12px 12px;
    padding: 1.6rem 1.5rem 1.4rem;
    min-height: 15rem;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 14px 22px -14px rgba(10, 25, 35, .55);
    transition: transform .25s ease;
  }
  .folder .label {
    background: #fff;
    color: #1c2a32;
    border-radius: 4px;
    padding: .8rem 1rem;
  }
  .folder .label h2 { font-size: 1.35rem; font-weight: 700; }
  .folder .label span { display: block; margin-top: .3rem; font-size: .95rem; color: #4a5b65; line-height: 1.4; }
  .folder .open { font-family: var(--display); font-weight: 500; font-size: 1rem; margin-top: 1.5rem; }
  .folder:hover .sheet, .folder:focus-visible .sheet { transform: translateY(-1.1rem); }
  .folder:hover .body, .folder:focus-visible .body { transform: translateY(.2rem); }

  .f-linde  { --c: #2f6f73; }
  .f-beuk   { --c: #7a3e65; }
  .f-scheld { --c: #a8741f; }

  /* ---------- Dossierweergave ---------- */
  .dossier { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
  .side {
    background: var(--c);
    color: #fff;
    padding: 2rem 1.5rem;
    display: flex; flex-direction: column; gap: 2rem;
  }
  .back {
    font-family: var(--display); font-size: .95rem; font-weight: 500;
    color: #fff; text-decoration: none; opacity: .9; width: fit-content;
  }
  .back:hover { text-decoration: underline; }
  .side h1 { font-size: 1.6rem; font-weight: 700; }
  .side .tagline { margin: .6rem 0 0; font-size: .98rem; opacity: .9; line-height: 1.45; }
  .topics { display: flex; flex-direction: column; gap: .35rem; margin: 0; padding: 0; list-style: none; }
  .topics a {
    display: block;
    padding: .7rem .9rem;
    border-radius: 8px;
    font-family: var(--display); font-weight: 500; font-size: 1.05rem;
    color: #fff; text-decoration: none;
    border-left: 4px solid transparent;
  }
  .topics a:hover { background: rgba(255,255,255,.14); }
  .topics a[aria-current="page"] { background: #fff; color: #1c2a32; border-left-color: rgba(0,0,0,.25); }
  .side :focus-visible { outline-color: #fff; }

  .main { padding: 3rem clamp(1.5rem, 5vw, 4.5rem) 5rem; }
  .main-inner { max-width: 760px; }
  .main h2 { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 700; margin-bottom: 1.5rem; }
  .main h2:focus { outline: none; }
  .lead { font-size: 1.25rem; line-height: 1.55; }

  /* team */
  .team { display: grid; gap: .9rem; margin: 0; padding: 0; list-style: none; }
  .member { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
  .mtop { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 1rem; align-items: center; }
  .member .mdesc { margin: .85rem 0 0; }
  .agenda { margin-top: .9rem; border-top: 1px solid var(--line); }
  .agenda > summary {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .7rem 0 .3rem; font-family: var(--display); font-weight: 500; font-size: .98rem; color: var(--c);
  }
  .agenda > summary:hover { text-decoration: underline; }
  .avatar {
    width: 3.2rem; height: 3.2rem; border-radius: 50%;
    background: var(--c); color: #fff;
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 1.05rem;
  }
  .member h3 { font-size: 1.1rem; margin: 0; }
  .member .role { color: var(--ink-soft); font-size: .95rem; margin: .1rem 0 0; }
  .member p { margin: 0; font-size: 1rem; }

  /* populatie */
  .total { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .total strong { font-family: var(--display); font-size: clamp(2.6rem, 6vw, 4rem); line-height: 1; color: var(--c); }
  .total span { color: var(--ink-soft); }
  /* uitklapbare secties */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev {
    width: .55rem; height: .55rem; justify-self: end; flex: none;
    border-right: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft);
    transform: rotate(-45deg); transition: transform .2s ease;
  }
  details[open] > summary .chev { transform: rotate(45deg); }
  .toolbar { display: flex; gap: .6rem; margin: 0 0 1rem; }
  .toolbar button {
    font: inherit; font-family: var(--display); font-size: .92rem; font-weight: 500;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 99px; padding: .35rem .9rem; cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--c); }
  .accs { border-top: 1px solid var(--line); }
  .acc { border-bottom: 1px solid var(--line); }
  .acc > summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .95rem .2rem; }
  .acc > summary:hover { background: color-mix(in srgb, var(--c) 7%, transparent); }
  .acc > summary h3 { font-size: 1.2rem; margin: 0; }
  .acc-body { padding: .2rem .2rem 1.5rem; }
  .acc.nested { border-bottom: 1px solid var(--line); }
  .acc.nested:last-child { border-bottom: 0; }
  .acc.nested > summary { padding: .7rem 0; }
  .acc.nested > summary h4 { font-family: var(--display); font-size: 1.05rem; margin: 0; color: var(--c); }
  .acc.nested > .acc-body { padding: .1rem 0 1rem; }
  .bars { display: grid; gap: .6rem; margin: 0; padding: 0; list-style: none; }
  .bars li { display: grid; grid-template-columns: 6.5rem 1fr 3rem; gap: .8rem; align-items: center; font-size: .98rem; }
  .bars .track { height: .9rem; background: var(--desk-dark); border-radius: 99px; overflow: hidden; }
  .bars .fill { height: 100%; background: var(--c); border-radius: 99px; }
  .bars .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .traits { display: grid; gap: 1rem; margin: 0; padding: 0; list-style: none; }
  .traits li { border-left: 4px solid var(--c); padding: .1rem 0 .1rem 1rem; }
  .traits strong { font-family: var(--display); display: block; font-size: 1.05rem; }
  .traits span { color: var(--ink-soft); }


  /* cijfers uit het dossier */
  .muted { color: var(--ink-soft); font-size: .98rem; }
  .ind { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .ind li {
    display: grid; grid-template-columns: 1fr 4.6rem 4.6rem; gap: .8rem; align-items: baseline;
    padding: .7rem 0; border-bottom: 1px solid var(--line);
  }
  .ind li.ind-head { padding: .35rem 0; font-size: .88rem; color: var(--ink-soft); }
  .ind small { display: block; color: var(--ink-soft); font-size: .88rem; line-height: 1.4; }
  .ind .num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 500; }
  .ind li.ind-head .num { font-weight: 400; }



  /* praktijkrooster per dag */
  .tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: .2rem 0 1rem; }
  .tabs button {
    font: inherit; font-family: var(--display); font-weight: 500; font-size: .98rem;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 99px; padding: .45rem 1.05rem; cursor: pointer;
  }
  .tabs button:hover { border-color: var(--c); }
  .tabs button[aria-selected="true"] { background: var(--c); border-color: var(--c); color: #fff; }
  .tl-scroll { overflow-x: auto; padding-bottom: .4rem; }
  .timeline { min-width: 640px; padding-right: 1rem; }
  .trow { display: grid; grid-template-columns: 10rem 1fr; gap: .8rem; align-items: center; padding: .3rem 0; border-bottom: 1px solid var(--line); }
  .trow.axis { border-bottom: 0; padding-bottom: 0; }
  .tname strong { display: block; font-family: var(--display); font-size: .88rem; line-height: 1.2; }
  .tname span { display: block; color: var(--ink-soft); font-size: .76rem; line-height: 1.25; }
  .track {
    position: relative; height: 2.5rem;
    background-image: repeating-linear-gradient(to right, var(--line) 0, var(--line) 1px, transparent 1px, transparent 10%);
  }
  .axis .track { height: 1.2rem; background: none; }
  .axis .track span { position: absolute; transform: translateX(-50%); font-size: .75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tb {
    --bc: #7b8794;
    position: absolute; top: .2rem; bottom: .2rem;
    display: flex; align-items: center;
    border-left: 3px solid var(--bc); border-radius: 3px;
    background: rgba(128, 128, 128, .18);
    background: color-mix(in srgb, var(--bc) 24%, var(--paper));
    padding: .1rem .3rem; font-size: .72rem; line-height: 1.2;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .tb.t-pauze { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line) 4px 5px); border-left-style: dashed; color: var(--ink-soft); }
  .tl-off { position: absolute; left: .5rem; top: 50%; transform: translateY(-50%); font-size: .8rem; font-style: italic; color: var(--ink-soft); }
  .daynote { margin: .8rem 0 0; font-size: .92rem; color: var(--ink-soft); }
  .err { padding: 2rem 1.5rem; max-width: 40rem; }
  .folder { touch-action: manipulation; }

  /* weekrooster */
  .main-inner.wide { max-width: 1000px; }
  .mbody { min-width: 0; }
  .mhead { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .hours { text-align: right; font-family: var(--display); }
  .hours strong { display: block; font-size: 1.05rem; }
  .hours span { color: var(--ink-soft); font-size: .92rem; }
  .split, .extern { margin: .7rem 0 0; font-size: .92rem; color: var(--ink-soft); }
  .week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .5rem; margin-top: .9rem; }
  .day { min-width: 0; }
  .dayname { font-family: var(--display); font-size: .82rem; font-weight: 500; color: var(--ink-soft); margin-bottom: .25rem; }
  .blocks { display: flex; flex-direction: column; gap: .25rem; }
  .off { font-size: .82rem; font-style: italic; color: var(--ink-soft); padding: .25rem 0; }
  .blk {
    --bc: #7b8794;
    border-left: 4px solid var(--bc);
    background: rgba(128, 128, 128, .12);
    background: color-mix(in srgb, var(--bc) 17%, transparent);
    border-radius: 4px; padding: .25rem .5rem; font-size: .8rem; line-height: 1.3;
  }
  .blk .tm { display: block; font-family: var(--display); font-weight: 500; font-variant-numeric: tabular-nums; }
  .blk .lb { display: block; color: var(--ink-soft); }
  .t-consult { --bc: #3b82c4; } .t-tele { --bc: #8b6fd6; } .t-huisbezoek { --bc: #3f9e6a; }
  .t-admin { --bc: #c99a2e; } .t-project { --bc: #cc4f86; } .t-overleg { --bc: #2a9a9a; }
  .t-opleiding { --bc: #d9742c; } .t-supervisie { --bc: #a0522d; } .t-onthaal { --bc: #7b8794; }
  .t-pauze { background: transparent; border-left: 4px dashed var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 1.4rem; }
  .legend .blk { padding: .2rem .6rem; }
  @media (max-width: 1150px) {
    .week { grid-template-columns: 1fr; gap: .6rem; }
    .day { display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; align-items: start; }
    .dayname { margin: .3rem 0 0; }
    .blocks { flex-direction: row; flex-wrap: wrap; }
    .blk { min-width: 7.5rem; }
  }


  /* SMART-opmaak */
  .smart-strip { display: flex; flex-wrap: wrap; gap: .6rem; margin: 0 0 1.2rem; }
  .ss-item {
    display: flex; align-items: center; gap: .5rem; padding: .25rem .95rem .25rem .3rem;
    background: var(--paper); border: 1px solid var(--line); border-radius: 99px;
    font-family: var(--display); font-weight: 500; font-size: .92rem;
  }
  .ss-hex {
    width: 2rem; height: 2rem; display: grid; place-items: center; font-weight: 700;
    background: var(--k); color: var(--kt);
    clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
  }
  .ss-item.dim { opacity: .5; }
  .smart-banner {
    display: flex; align-items: center; gap: 1rem; margin: 2.4rem 0 1rem;
    padding: .5rem 1.3rem .5rem .6rem; background: var(--k); color: var(--kt);
    border-radius: 8px 44px 44px 8px; font-family: var(--display);
  }
  .sb-hex {
    flex: none; width: 3.6rem; height: 3.6rem; display: grid; place-items: center;
    background: #fff; color: var(--k);
    clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
  }
  .sb-hex svg { width: 1.9rem; height: 1.9rem; }
  .sb-titel { font-size: clamp(1.05rem, 3.6vw, 1.55rem); font-weight: 700; letter-spacing: .26em; text-transform: uppercase; }
  .sb-titel b { font-size: 1.35em; letter-spacing: .12em; }
  .sb-nr { margin-left: auto; padding: .1rem .75rem; border-radius: 99px; background: rgba(255, 255, 255, .6); color: var(--kt); font-weight: 700; }
  .smart-banner + .muted { margin-top: -.4rem; }
  .wb-card.themed { border-left: 6px solid var(--k); background: color-mix(in srgb, var(--k) 9%, var(--paper)); }
  .wb-card.themed textarea { background: var(--paper); }
  .wb-card.themed textarea:not([readonly]) { border-color: var(--k); }

  .sb-uitleg { margin: -.2rem 0 1.2rem; padding: .7rem 1rem .8rem; border-left: 6px solid var(--k); border-radius: 0 8px 8px 0; background: color-mix(in srgb, var(--k) 11%, var(--paper)); font-size: .98rem; }
  .sb-uitleg p { margin: .4rem 0 0; }
  .sb-lbl { display: block; font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }

  /* indicatoren (meetbaar) */
  .ind { display: grid; gap: 1rem; margin-top: .4rem; }
  .ind-som { margin: 0; font-size: .92rem; font-weight: 500; color: var(--ink-soft); }
  .ind-kaart { display: grid; gap: .7rem; padding: .8rem 1rem 1rem; background: var(--paper); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 8px; }
  .ind-kaart[data-soort="structuur"] { border-left-color: #8E7CC3; }
  .ind-kaart[data-soort="proces"] { border-left-color: #3AA6B9; }
  .ind-kaart[data-soort="uitkomst"] { border-left-color: #E8763A; }
  .ind-kop { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; }
  .ind-soort { display: flex; flex-wrap: wrap; gap: .35rem; }
  .ind-chip { --cc: #8E7CC3; font: inherit; font-family: var(--display); font-weight: 500; font-size: .88rem; padding: .3rem .9rem; border: 2px solid var(--cc); border-radius: 99px; background: transparent; color: var(--ink); cursor: pointer; }
  .ind-chip.chip-proces { --cc: #3AA6B9; } .ind-chip.chip-uitkomst { --cc: #E8763A; }
  .ind-chip.aan { background: var(--cc); color: #14212a; }
  .ind .ind-kaart label { display: grid; gap: .25rem; font-size: .9rem; font-weight: 500; color: var(--ink-soft); }
  .ind .ind-kaart textarea, .ind .ind-kaart input[type="text"] { width: 100%; min-width: 0; min-height: 0; padding: .45rem .6rem; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
  .ind .ind-kaart textarea { min-height: 3.6rem; resize: vertical; }
  .ind-twee { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  @media (max-width: 700px) { .ind-twee { grid-template-columns: 1fr; } }

  /* volume/resource balans */
  .bal { display: grid; gap: 1.3rem; margin-top: .4rem; }
  .bal-blok h5 { margin: 0 0 .6rem; padding: .3rem .8rem; background: #1B5E80; color: #fff; text-align: center; border-radius: 4px; font-family: var(--display); font-size: .95rem; font-weight: 500; }
  .bal-vol { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .6rem .8rem; }
  .bal-vol label { display: grid; gap: .25rem; font-size: .88rem; color: var(--ink-soft); }
  .bal-vol input { width: 9rem; }
  .bal input[type="text"] { font: inherit; padding: .4rem .55rem; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); min-width: 0; width: 100%; }
  .bal-vol input[type="text"] { width: 9rem; }
  .bal-op { font-size: 1.5rem; padding-bottom: .3rem; color: var(--ink-soft); }
  .bal-res { display: grid; padding: .4rem .9rem; border-radius: 6px; background: color-mix(in srgb, var(--k, #1DB88E) 24%, var(--paper)); }
  .bal-res span { font-size: .8rem; color: var(--ink-soft); }
  .bal-res strong { font-family: var(--display); font-size: 1.25rem; }
  .bal-scroll { overflow-x: auto; }
  .bal-tab { width: 100%; min-width: 560px; border-collapse: collapse; }
  .bal-tab th { text-align: left; padding: .4rem .5rem; font-family: var(--display); font-weight: 500; font-size: .85rem; background: color-mix(in srgb, var(--ink) 9%, var(--paper)); border: 1px solid var(--line); }
  .bal-tab td { padding: .3rem .4rem; border: 1px solid var(--line); vertical-align: top; }
  .bal-tab td.num { text-align: right; vertical-align: middle; white-space: nowrap; font-family: var(--display); font-weight: 500; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--k, #1DB88E) 20%, var(--paper)); }
  .bal-tab tfoot th { background: color-mix(in srgb, var(--k, #1DB88E) 30%, var(--paper)); }
  .bal-sub { display: block; margin-top: .15rem; color: var(--ink-soft); font-size: .78rem; }
  .bal-warn { display: block; margin-top: .15rem; color: #c0392b; font-size: .78rem; font-weight: 500; }
  .bal-del { background: none; border: 0; padding: .2rem .5rem; font-size: 1.2rem; color: var(--ink-soft); cursor: pointer; }
  .bal-del:hover { color: #c0392b; }
  .bal-acties { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .7rem; }

}

/* ---------- Indicatoren (Meetbaar) ---------- */
const IND_SOORTEN = { structuur: "Structuur", proces: "Proces", uitkomst: "Uitkomst" };
const indLegeRij = () => ({ s: "", i: "", d: "", m: "" });
function indNormaliseer(o) {
  o = o && typeof o === "object" ? o : {};
  const rijen = Array.isArray(o.r) && o.r.length
    ? o.r.map(x => ({
        s: Object.keys(IND_SOORTEN).includes(x.s) ? x.s : "",
        i: String(x.i == null ? "" : x.i), d: String(x.d == null ? "" : x.d), m: String(x.m == null ? "" : x.m)
      }))
    : [indLegeRij(), indLegeRij(), indLegeRij()];
  return { r: rijen };
}
function indLees(id) {
  const ta = document.getElementById("wb-" + id);
  let o = {};
  try { o = JSON.parse(ta && ta.value ? ta.value : "{}"); } catch (e) { o = {}; }
  return indNormaliseer(o);
}
function indSchrijf(id, st) {
  const ta = document.getElementById("wb-" + id);
  if (!ta) return;
  ta.value = JSON.stringify(st);
  ta.dataset.dirty = "1";
}
function indBuild(id) {
  const box = document.querySelector(`[data-ind="${id}"]`);
  if (!box) return;
  const st = indLees(id);
  box.innerHTML = `
    <p class="ind-som" data-ind-som role="status"></p>
    ${st.r.map((r, i) => `
    <div class="ind-kaart" data-soort="${esc(r.s)}">
      <div class="ind-kop">
        <strong>Indicator ${i + 1}</strong>
        <div class="ind-soort" role="group" aria-label="Soort indicator ${i + 1}">
          ${Object.entries(IND_SOORTEN).map(([k, n]) => `<button type="button" class="ind-chip chip-${k}${r.s === k ? " aan" : ""}" data-ind-act="soort" data-i="${i}" data-s="${k}" aria-pressed="${r.s === k}">${n}</button>`).join("")}
        </div>
        <button type="button" class="bal-del" data-ind-act="del" data-i="${i}" aria-label="Indicator ${i + 1} verwijderen">×</button>
      </div>
      <label>Wat is de indicator precies?
        <textarea rows="2" data-ind-r="${i}.i" placeholder="Formuleer wat jullie exact meten, met teller en noemer.">${esc(r.i)}</textarea></label>
      <div class="ind-twee">
        <label>Wat is het doel?
          <input type="text" data-ind-r="${i}.d" value="${esc(r.d)}" placeholder="Welke waarde willen jullie bereiken?"></label>
        <label>Wanneer wordt dit gemeten?
          <input type="text" data-ind-r="${i}.m" value="${esc(r.m)}" placeholder="Bv. elk jaar in januari"></label>
      </div>
    </div>`).join("")}
    <div class="bal-acties"><button type="button" class="btn secondary" data-ind-act="add">Indicator toevoegen</button></div>`;
  indBereken(id);
}
function indBereken(id) {
  const box = document.querySelector(`[data-ind="${id}"]`);
  const som = box && box.querySelector("[data-ind-som]");
  if (!som) return;
  const st = indLees(id);
  const tel = { structuur: 0, proces: 0, uitkomst: 0 };
  st.r.forEach(r => { if (r.s) tel[r.s]++; });
  const ontbreekt = Object.keys(tel).filter(k => !tel[k]).map(k => IND_SOORTEN[k].toLowerCase());
  som.textContent = Object.keys(tel).map(k => `${IND_SOORTEN[k]}: ${tel[k]}`).join(" · ")
    + (ontbreekt.length && st.r.some(r => r.s) ? `. Probeer minstens één indicator van elk soort te formuleren (nog ontbrekend: ${ontbreekt.join(", ")}).` : "");
  box.querySelectorAll(".ind-kaart").forEach((kaart, i) => { kaart.dataset.soort = st.r[i] ? st.r[i].s : ""; });
}
function indInput(el) {
  const box = el.closest("[data-ind]");
  if (!box) return;
  const id = box.dataset.ind, st = indLees(id);
  const [i, veld] = el.dataset.indR.split(".");
  if (st.r[Number(i)]) st.r[Number(i)][veld] = el.value;
  indSchrijf(id, st);
  indBereken(id);
}
function indActie(el) {
  const box = el.closest("[data-ind]");
  if (!box) return;
  const id = box.dataset.ind, st = indLees(id), act = el.dataset.indAct;
  if (act === "add") st.r.push(indLegeRij());
  if (act === "del") { st.r.splice(Number(el.dataset.i), 1); if (!st.r.length) st.r.push(indLegeRij()); }
  if (act === "soort") { const r = st.r[Number(el.dataset.i)]; if (r) r.s = r.s === el.dataset.s ? "" : el.dataset.s; }
  indSchrijf(id, st);
  indBuild(id);
}

  const v = o.v || {};
  const rijen = Array.isArray(o.r) && o.r.length
    ? o.r.map(x => ({ d: String(x.d == null ? "" : x.d), a: String(x.a == null ? "" : x.a), h: String(x.h == null ? "" : x.h), t: String(x.t == null ? "" : x.t) }))
    : [balLegeRij(), balLegeRij(), balLegeRij(), balLegeRij()];
  return { v: { n: String(v.n == null ? "" : v.n), u: String(v.u == null ? "" : v.u) }, r: rijen, o: ["niet", "weetniet", "haalbaar"].includes(o.o) ? o.o : "" };
}
function balLees(id) {
  const ta = document.getElementById("wb-" + id);
  let o = {};
  try { o = JSON.parse(ta && ta.value ? ta.value : "{}"); } catch (e) { o = {}; }
  return balNormaliseer(o);
}
function balSchrijf(id, st) {
  const ta = document.getElementById("wb-" + id);
  if (!ta) return;
  ta.value = JSON.stringify(st);
  ta.dataset.dirty = "1";
}
/* uren die een teamlid volgens het rooster in de praktijk werkt (zonder pauzes en opleidingsdag) */
function teamUren(m) {
  if (!m || !m.rooster) return 0;
  const mins = t => { const [h, k] = t.split(":").map(Number); return h * 60 + k; };
  let tot = 0;
  for (const dag of Object.values(m.rooster)) for (const b of dag) if (b.type !== "pauze" && b.type !== "opleiding") tot += (mins(b.tot) - mins(b.van)) / 60;
  return tot;
}
const balPraktijk = () => PRACTICES.find(x => x.id === wb.praktijk);

function balFiguren(x0, kleuren) {
  return kleuren.map((k, i) => `<g transform="translate(${x0 + i * 42},120)" fill="${k}"><circle cx="0" cy="-33" r="8"/><rect x="-11" y="-23" width="22" height="23" rx="9"/></g>`).join("");
}

function balBuild(id) {
  const box = document.querySelector(`[data-bal="${id}"]`);
  if (!box) return;
  const st = balLees(id);
  const praktijk = balPraktijk();
  const team = praktijk ? praktijk.team.filter(m => m.rooster) : [];
  const rij = (r, i) => {
    const m = r.t && praktijk ? praktijk.team.find(x => x.naam === r.t) : null;
    return `<tr>
      <td><input type="text" data-bal-r="${i}.d" value="${esc(r.d)}" placeholder="Discipline" aria-label="Discipline, rij ${i + 1}">${m ? `<small class="bal-sub">${esc(m.naam)} · ${balFmt(teamUren(m))} u/week in het rooster</small>` : ""}</td>
      <td><input type="text" inputmode="decimal" data-bal-r="${i}.a" value="${esc(r.a)}" aria-label="Aantal, rij ${i + 1}"></td>
      <td><input type="text" inputmode="decimal" data-bal-r="${i}.h" value="${esc(r.h)}" aria-label="Uur per week per zorgverlener, rij ${i + 1}"><small class="bal-warn" data-bal-warn="${i}" hidden></small></td>
      <td class="num" data-bal-rt="${i}"></td>
      <td><button type="button" class="bal-del" data-bal-act="del" data-i="${i}" aria-label="Rij ${i + 1} verwijderen">×</button></td>
    </tr>`;
  };
  box.innerHTML = `
    <div class="bal-blok">
      <h5>Volume</h5>
      <div class="bal-vol">
        <label>Aantal patiënten<input type="text" inputmode="decimal" data-bal-f="n" value="${esc(st.v.n)}"></label>
        <span class="bal-op" aria-hidden="true">×</span>
        <label>Uur/jaar/patiënt<input type="text" inputmode="decimal" data-bal-f="u" value="${esc(st.v.u)}"></label>
        <span class="bal-op" aria-hidden="true">=</span>
        <div class="bal-res"><span>Totale werkbelasting</span><strong data-bal-wl>0 u/jaar</strong></div>
      </div>
    </div>
    <div class="bal-blok">
      <h5>Resources</h5>
      <div class="bal-scroll"><table class="bal-tab">
        <thead><tr><th>Discipline</th><th>Aantal</th><th>Uur/week per zorgverlener</th><th>Totaal op ${BAL_WEKEN} weken</th><th><span class="sr-only">Verwijderen</span></th></tr></thead>
        <tbody>${st.r.map(rij).join("")}</tbody>
        <tfoot><tr><th colspan="3">TOTAAL</th><td class="num" data-bal-cap>0 u</td><td></td></tr></tfoot>
      </table></div>
      <div class="bal-acties">
        <button type="button" class="btn secondary" data-bal-act="add">Rij toevoegen</button>
        ${team.length ? `<select data-bal-team aria-label="Teamlid toevoegen"><option value="">Teamlid uit het rooster toevoegen…</option>${team.map((m, i) => `<option value="${i}">${esc(m.naam)} – ${esc(m.rol)}</option>`).join("")}</select>` : ""}
      </div>
    </div>
    <div class="bal-vis">
      <svg class="bal-svg" viewBox="0 0 420 175" role="img" aria-label="Weegschaal: werkbelasting links, beschikbare uren rechts">
        <polygon points="210,126 184,170 236,170" fill="#1B5E80"/>
        <g class="bal-beam" data-bal-beam style="transform-origin:210px 126px">
          <rect x="25" y="120" width="370" height="11" rx="5.5" fill="#1B5E80"/>
          ${balFiguren(60, ["#1B7F80", "#E8763A", "#9AA5AB", "#E5AE00"])}
          ${balFiguren(236, ["#E8763A", "#1B7F80", "#E5AE00", "#9AA5AB"])}
        </g>
      </svg>
      <div class="bal-leg"><span>Volume (werkbelasting)</span><span>Resources (beschikbare uren)</span></div>
      <p class="bal-uit" data-bal-uit role="status"></p>
    </div>
    <div class="bal-blok">
      <h5>Hoe haalbaar is de volume/resource balans voor jullie?</h5>
      <div class="bal-schaal" role="group" aria-label="Haalbaarheid">
        <button type="button" class="bal-opt opt-niet" data-bal-act="oordeel" data-o="niet" aria-pressed="false">Niet haalbaar</button>
        <button type="button" class="bal-opt opt-weetniet" data-bal-act="oordeel" data-o="weetniet" aria-pressed="false">Ik weet het niet</button>
        <button type="button" class="bal-opt opt-haalbaar" data-bal-act="oordeel" data-o="haalbaar" aria-pressed="false">Haalbaar</button>
      </div>
      <p class="bal-advies" data-bal-advies role="status"></p>
    </div>`;
  balBereken(id);
}

function balBereken(id) {
  const box = document.querySelector(`[data-bal="${id}"]`);
  if (!box) return;
  const st = balLees(id);
  const praktijk = balPraktijk();
  const wl = balNum(st.v.n) * balNum(st.v.u);
  let cap = 0;
  st.r.forEach((r, i) => {
    const t = balNum(r.a) * balNum(r.h) * BAL_WEKEN;
    cap += t;
    const cel = box.querySelector(`[data-bal-rt="${i}"]`);
    if (cel) cel.textContent = t ? balFmt(t) : "";
    const warn = box.querySelector(`[data-bal-warn="${i}"]`);
    if (warn) {
      const m = r.t && praktijk ? praktijk.team.find(x => x.naam === r.t) : null;
      const max = m ? teamUren(m) : 0;
      const teVeel = Boolean(m) && balNum(r.h) > max + 1e-9;
      warn.hidden = !teVeel;
      warn.textContent = teVeel ? `Meer dan de ${balFmt(max)} u/week uit het rooster.` : "";
    }
  });
  box.querySelector("[data-bal-wl]").textContent = balFmt(wl) + " u/jaar";
  box.querySelector("[data-bal-cap]").textContent = balFmt(cap) + " u";

  let hoek = 0, verhouding = null;
  if (wl > 0 && cap > 0) { verhouding = cap / wl; hoek = Math.max(-16, Math.min(16, 24 * Math.log2(wl / cap))); }
  const beam = box.querySelector("[data-bal-beam]");
  if (beam) beam.style.transform = `rotate(${-hoek}deg)`;   // meer werkbelasting dan uren: de linkerkant zakt

  const uit = box.querySelector("[data-bal-uit]");
  if (verhouding == null) {
    uit.textContent = "Vul het volume en de resources in om de balans te zien.";
    uit.dataset.toestand = "";
  } else {
    const pct = Math.round(verhouding * 100);
    const lijkt = verhouding >= 1 ? "haalbaar" : verhouding >= 0.85 ? "een grensgeval" : "niet haalbaar";
    uit.textContent = `Beschikbaar: ${balFmt(cap)} u/jaar voor een werkbelasting van ${balFmt(wl)} u/jaar (${pct}%). Op basis van de cijfers lijkt dit ${lijkt}.`;
    uit.dataset.toestand = verhouding >= 1 ? "goed" : verhouding >= 0.85 ? "grens" : "slecht";
  }
  box.querySelectorAll("[data-o]").forEach(b => {
    const aan = b.dataset.o === st.o;
    b.setAttribute("aria-pressed", String(aan));
    b.classList.toggle("aan", aan);
  });
  const adv = box.querySelector("[data-bal-advies]");
  if (adv) adv.textContent = st.o ? BAL_ADVIES[st.o] : "";
}

function balInput(el) {
  const box = el.closest("[data-bal]");
  if (!box) return;
  const id = box.dataset.bal, st = balLees(id);
  if (el.dataset.balF !== undefined) {
    st.v[el.dataset.balF] = el.value;
  } else if (el.dataset.balR !== undefined) {
    const [i, veld] = el.dataset.balR.split(".");
    if (st.r[Number(i)]) st.r[Number(i)][veld] = el.value;
  }
  balSchrijf(id, st);
  balBereken(id);
}

function balActie(el) {
  const box = el.closest("[data-bal]");
  if (!box) return;
  const id = box.dataset.bal, st = balLees(id), act = el.dataset.balAct;
  if (act === "oordeel") {
    st.o = st.o === el.dataset.o ? "" : el.dataset.o;
    balSchrijf(id, st);
    balBereken(id);
    return;
  }
  if (act === "add") st.r.push(balLegeRij());
  if (act === "del") { st.r.splice(Number(el.dataset.i), 1); if (!st.r.length) st.r.push(balLegeRij()); }
  balSchrijf(id, st);
  balBuild(id);
}

function balTeamlid(sel) {
  if (sel.value === "") return;
  const box = sel.closest("[data-bal]");
  const praktijk = balPraktijk();
  if (!box || !praktijk) return;
  const m = praktijk.team.filter(x => x.rooster)[Number(sel.value)];
  if (!m) return;
  const id = box.dataset.bal, st = balLees(id);
  const nieuw = { d: m.rol.split(/[,(]/)[0].trim(), a: "1", h: "", t: m.naam };
  const leeg = st.r.findIndex(r => !r.d && !r.a && !r.h);   // eerste lege rij hergebruiken
  if (leeg >= 0) st.r[leeg] = nieuw; else st.r.push(nieuw);
  balSchrijf(id, st);
  balBuild(id);
}

async function api(path, options = {}) {
  const res = await fetch(API_URL.replace(/\/$/, "") + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Wachtwoord": wb.pw || "", ...(options.headers || {}) }
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* lege respons */ }
  if (!res.ok) {
    const err = new Error((data && data.fout) || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

function wbStatus(tekst, soort) {
  const el = document.getElementById("wb-status");
  if (!el) return;
  el.textContent = tekst || "";
  el.hidden = !tekst;
  el.className = "wb-note" + (soort === "err" ? " err" : "");
}

function wbStartPolling() {
  clearInterval(wbTimer);
  wbTimer = setInterval(() => wbLoad({}), 20000);
}

function wbRenderLock() {
  const root = wbRoot();
  if (!root) return;
  root.innerHTML = `<div class="wb-bar">
      <span>Dit werkblad is vergrendeld. Vul het wachtwoord van workshop ${wb.nr} in zodra jullie dat krijgen.</span>
      <input id="wb-pwinput" type="password" placeholder="Wachtwoord" autocomplete="off" aria-label="Wachtwoord workshop ${wb.nr}">
      <button type="button" class="btn" data-wb="unlock">Openen</button>
    </div>`;
}

function initWerkblad(p, nr) {
  wb.praktijk = p.id; wb.nr = nr; wb.loaded = false; wb.versies = {}; wb.ids = [];
  wb.pw = wbStore.get("wb-pw-" + nr) || null;
  wb.naam = wbStore.get("wb-naam") || "";
  if (!API_URL) {
    wbStatus("De werkbladen zijn nog niet gekoppeld aan een database. Vul eerst API_URL in de code in.", "err");
    return;
  }
  if (!wb.pw) { wbRenderLock(); return; }
  wbLoad({});
  wbStartPolling();
}

function wbKaart(q, thema, niveau, binnenwerk) {
  const id = esc(q.id);
  return `
      <section class="wb-card${thema ? " themed" : ""}"${thema ? ` style="--k:${thema.kleur}"` : ""}>
        <${niveau}>${esc(q.titel)}</${niveau}>
        ${q.hint ? `<p class="muted">${esc(q.hint)}</p>` : ""}
        ${binnenwerk}
        <div class="wb-meta">
          <span id="wb-when-${id}"></span>
          <button type="button" class="btn" data-wb="save" data-q="${id}">Opslaan</button>
          <button type="button" class="btn secondary" data-wb="reload" data-q="${id}" hidden>Laatste versie laden</button>
          <span id="wb-msg-${id}" class="wb-msg" role="status"></span>
        </div>
        ${q.referentie ? `<details class="ref"><summary>Toon referentieantwoord</summary><p>${esc(q.referentie)}</p></details>` : ""}
      </section>`;
}

function wbBuild(data) {
  const root = wbRoot();
  const praktijk = PRACTICES.find(x => x.id === wb.praktijk);
  wb.ids = data.opdrachten.map(o => o.id);
  const sleutels = data.opdrachten.filter(o => o.id.startsWith("kop-")).map(o => smartSleutel(o.id)).filter(k => SMART[k]);
  const niveau = data.opdrachten.some(o => o.id.startsWith("kop-")) ? "h4" : "h3";
  let thema = null;
  const delen = data.opdrachten.map(q => {
    if (q.id.startsWith("kop-")) { thema = SMART[smartSleutel(q.id)] || null; return wbKopHtml(q); }
    const id = esc(q.id);
    let binnenwerk;
    if (q.id.startsWith("widget-balans")) binnenwerk = `<input type="hidden" id="wb-${id}"><div class="bal" data-bal="${id}"></div>`;
    else if (q.id.startsWith("widget-indicatoren")) binnenwerk = `<input type="hidden" id="wb-${id}"><div class="ind" data-ind="${id}"></div>`;
    else binnenwerk = `<textarea id="wb-${id}" rows="5" placeholder="Nog niets ingevuld." aria-label="${esc(q.titel)}"></textarea>`;
    return wbKaart(q, thema, niveau, binnenwerk);
  });
  root.innerHTML = `
    <div class="wb-bar">
      <span class="wb-who">Werkblad workshop ${wb.nr}${praktijk ? " – " + esc(praktijk.naam) : ""}</span>
      <input id="wb-naaminput" type="text" maxlength="40" placeholder="Je naam (optioneel)" autocomplete="off" aria-label="Je naam (optioneel)">
      <button type="button" class="btn secondary" data-wb="refresh">Vernieuwen</button>
      <button type="button" class="btn secondary" data-wb="lock">Vergrendelen</button>
    </div>
    ${sleutels.length ? wbStripHtml(sleutels) : ""}
    ${delen.length ? delen.join("") : '<p class="muted">Voor deze workshop zijn nog geen opdrachten ingesteld.</p>'}`;
  const naam = document.getElementById("wb-naaminput");
  if (naam) naam.value = wb.naam;
  data.opdrachten.filter(o => o.id.startsWith("widget-balans")).forEach(o => balBuild(o.id));
  data.opdrachten.filter(o => o.id.startsWith("widget-indicatoren")).forEach(o => indBuild(o.id));
}

function wbFill(data, opts) {
  data.opdrachten.forEach(q => {
    const ta = document.getElementById("wb-" + q.id);
    if (!ta) return;
    const r = data.antwoorden[q.id] || null;
    const remote = r ? r.versie : 0;
    const dirty = ta.dataset.dirty === "1" && opts.force !== q.id;
    const msg = document.getElementById("wb-msg-" + q.id);
    const reload = document.querySelector(`[data-wb=reload][data-q="${q.id}"]`);
    if (!dirty) {
      const nieuweWaarde = r ? r.antwoord : "";
      const veranderd = ta.value !== nieuweWaarde;
      ta.value = nieuweWaarde;
      delete ta.dataset.dirty;
      const wBox = document.querySelector(`[data-bal="${q.id}"], [data-ind="${q.id}"]`);
      if (wBox && (veranderd || wBox.childElementCount === 0)) {
        if (q.id.startsWith("widget-balans")) balBuild(q.id); else indBuild(q.id);
      }
      wb.versies[q.id] = remote;
      if (msg) msg.textContent = "";
      if (reload) reload.hidden = true;
    } else if ((wb.versies[q.id] || 0) !== remote) {
      if (msg) msg.textContent = "Let op: iemand anders heeft dit ondertussen aangepast.";
      if (reload) reload.hidden = false;
    }
    const meta = document.getElementById("wb-when-" + q.id);
    if (meta) meta.textContent = r
      ? "Laatst aangepast" + (r.door ? " door " + r.door : "") + " op " + wbDatum(r.bijgewerkt_op)
      : "Nog niet ingevuld";
  });
}

async function wbLoad(opts) {
  const id = wb.praktijk, nr = wb.nr;
  if (!id || !API_URL || !wb.pw) return;
  try {
    const data = await api(`/api/werkblad?workshop=${nr}&praktijk=${encodeURIComponent(id)}`);
    if (wb.praktijk !== id || wb.nr !== nr || !wbRoot()) return;   // ondertussen naar een andere pagina
    if (!wb.loaded || data.opdrachten.map(o => o.id).join("|") !== wb.ids.join("|")) wbBuild(data);
    wbFill(data, opts);
    wb.loaded = true;
    wbStatus("");
  } catch (e) {
    if (e.status === 401) {
      clearInterval(wbTimer);
      wb.pw = null; wb.loaded = false;
      wbStore.del("wb-pw-" + nr);
      wbRenderLock();
      wbStatus(opts.unlock ? "Dat wachtwoord klopt niet." : "Het wachtwoord is niet meer geldig. Vul het opnieuw in.", "err");
      return;
    }
    if (!wb.loaded) wbStatus("Kon het werkblad niet laden (" + e.message + "). Controleer je internetverbinding.", "err");
  }
}

async function wbSave(qid) {
  const ta = document.getElementById("wb-" + qid);
  const msg = document.getElementById("wb-msg-" + qid);
  const reload = document.querySelector(`[data-wb=reload][data-q="${qid}"]`);
  if (!ta || !msg) return;
  msg.textContent = "Opslaan…";
  try {
    const res = await api("/api/antwoord", {
      method: "PUT",
      body: JSON.stringify({
        workshop: wb.nr, praktijk: wb.praktijk, vraag: qid, antwoord: ta.value,
        naam: wb.naam || null, verwacht: wb.versies[qid] || 0
      })
    });
    wb.versies[qid] = res.versie;
    delete ta.dataset.dirty;
    if (reload) reload.hidden = true;
    msg.textContent = "Opgeslagen ✓";
    const meta = document.getElementById("wb-when-" + qid);
    if (meta) meta.textContent = "Laatst aangepast" + (wb.naam ? " door " + wb.naam : "") + " op " + wbDatum(res.bijgewerkt_op);
  } catch (e) {
    if (e.message === "conflict") {
      msg.textContent = "Iemand anders heeft dit ondertussen aangepast. Kopieer eerst jullie eigen tekst en laad dan de laatste versie.";
      if (reload) reload.hidden = false;
    } else if (e.status === 401) {
      clearInterval(wbTimer);
      wb.pw = null; wb.loaded = false; wbStore.del("wb-pw-" + wb.nr);
      wbRenderLock();
      wbStatus("Het wachtwoord is niet meer geldig. Vul het opnieuw in.", "err");
    } else if (e.message === "te_lang") {
      msg.textContent = "Deze tekst is te lang (maximum 10.000 tekens).";
    } else {
      msg.textContent = "Opslaan is niet gelukt (" + e.message + "). Probeer het opnieuw.";
    }
  }
}

async function wbAction(act, q) {
  if (act === "refresh") { wbLoad({}); return; }
  if (act === "reload") { wbLoad({ force: q }); return; }
  if (act === "save") { wbSave(q); return; }
  if (act === "lock") {
    clearInterval(wbTimer);
    wb.pw = null; wb.loaded = false; wbStore.del("wb-pw-" + wb.nr);
    wbStatus(""); wbRenderLock();
    return;
  }
  if (act === "unlock") {
    const pw = ((document.getElementById("wb-pwinput") || {}).value || "").trim();
    if (!pw) { wbStatus("Vul het wachtwoord in.", "err"); return; }
    wb.pw = pw;
    await wbLoad({ unlock: true });
    if (wb.pw) { wbStore.set("wb-pw-" + wb.nr, wb.pw); wbStartPolling(); }
  }
}

const acc = (titel, inhoud, nested, open) => `

    <div class="acc-body">${inhoud}</div>
  </details>`;

const TOOLBAR = `<div class="toolbar"><button type="button" data-all="open">Alles openen</button><button type="button" data-all="close">Alles sluiten</button></div>`;

const werkbladShell = nr => `
  <p class="muted">Werk hier samen met jullie groep aan de opdrachten van workshop ${nr}. Wat jullie opslaan blijft bewaard en kunnen jullie de volgende keer terugvinden. Vul geen echte patiënt- of persoonsgegevens in.</p>
  <div id="wb-status" class="wb-note" role="status" hidden></div>
  <div id="wb-root"></div>`;

const RENDERERS = {
  ws1() { return werkbladShell(1); },
  ws2() { return werkbladShell(2); },
  ws3() { return werkbladShell(3); },
  visie(p) {
    const [first, ...rest] = p.visie;
    return `<p class="lead">${first}</p>${rest.map(t => `<p>${t}</p>`).join("")}`;
  },
  team(p) {
    const initials = n => n.replace(/^Dr\.\s*/, "").split(" ").map(w => w[0]).slice(0, 2).join("");
    const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const fmtH = n => n.toLocaleString("nl-BE", { maximumFractionDigits: 1 }) + " u";
    const hoursOf = r => {
      const per = {}; let tot = 0;
      for (const [k] of DAGEN) for (const b of (r[k] || [])) {
        if (b.type === "pauze") continue;
        const h = (mins(b.tot) - mins(b.van)) / 60;
        per[b.type] = (per[b.type] || 0) + h; tot += h;
      }
      return { tot, per };
    };
    const lab = b => b.label || TYPES[b.type].naam;
    const blk = b => `<div class="blk t-${b.type}"><span class="tm">${b.van}–${b.tot}</span><span class="lb">${lab(b)}</span></div>`;
    const used = new Set();
    p.team.forEach(m => m.rooster && Object.values(m.rooster).flat().forEach(b => used.add(b.type)));
    const legend = Object.keys(TYPES).filter(t => used.has(t)).map(t => `<span class="blk t-${t}"><span class="lb">${TYPES[t].naam}</span></span>`).join("");

    /* --- teamleden met uitklapbare persoonlijke werkagenda --- */
    const members = p.team.map(m => {
      let meta = "", agenda = "";
      if (m.rooster) {
        const { tot, per } = hoursOf(m.rooster);
        const vte = tot >= 38 ? "voltijds" : (tot / 38).toLocaleString("nl-BE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " VTE";
        meta = `<div class="hours"><strong>${fmtH(tot)} per week</strong><span>${vte}</span></div>`;
        const split = Object.entries(per).sort((x, y) => y[1] - x[1]).map(([t, h]) => `${TYPES[t].kort} ${fmtH(h)}`).join(" · ");
        agenda = `
          <details class="agenda">
            <summary>Persoonlijke werkagenda<span class="chev" aria-hidden="true"></span></summary>
            <div class="week" role="group" aria-label="Weekrooster van ${m.naam}">
              ${DAGEN.map(([k, naam]) => `
                <div class="day"><div class="dayname" title="${naam}">${naam.slice(0, 2)}</div>
                  <div class="blocks">${(m.rooster[k] || []).map(blk).join("") || '<div class="off">Niet aanwezig</div>'}</div></div>`).join("")}
            </div>
            <p class="split">Verdeling: ${split}</p>
          </details>`;
      } else {
        meta = `<div class="hours"><strong>Extern</strong></div>`;
        agenda = `<p class="extern">${m.extern}</p>`;
      }
      return `
      <li class="member">
        <div class="mtop">
          <div class="avatar" aria-hidden="true">${initials(m.naam)}</div>
          <div><h3>${m.naam}</h3><div class="role">${m.rol}</div></div>
          ${meta}
        </div>
        <p class="mdesc">${m.tekst}</p>
        ${agenda}
      </li>`;
    }).join("");

    /* --- algemeen praktijkrooster: één tabblad per dag, tijdlijn per teamlid --- */
    const START = 8 * 60, END = 18 * 60;
    const pos = t => (mins(t) - START) / (END - START) * 100;
    const withRooster = p.team.filter(m => m.rooster);
    const externen = p.team.filter(m => !m.rooster);
    const axis = `<div class="trow axis" aria-hidden="true"><div></div><div class="track">${
      Array.from({ length: 11 }, (_, i) => `<span style="left:${i * 10}%">${8 + i}u</span>`).join("")}</div></div>`;
    const panel = ([k, naam], i) => {
      const rows = withRooster.map(m => {
        const bl = m.rooster[k] || [];
        const cells = bl.map(b => `<div class="tb t-${b.type}" style="left:${pos(b.van)}%;width:${pos(b.tot) - pos(b.van)}%" title="${b.van}–${b.tot} · ${lab(b)}">${lab(b)}</div>`).join("");
        return `<div class="trow"><div class="tname"><strong>${m.naam}</strong><span>${m.rol}</span></div>
          <div class="track">${cells || '<span class="tl-off">niet aanwezig</span>'}</div></div>`;
      }).join("");
      const aanwezig = withRooster.filter(m => (m.rooster[k] || []).some(b => b.type !== "pauze" && b.type !== "opleiding")).length;
      const opl = withRooster.filter(m => (m.rooster[k] || []).some(b => b.type === "opleiding"));
      return `
      <div role="tabpanel" id="panel-${k}" aria-labelledby="tab-${k}" ${i ? "hidden" : ""}>
        <div class="tl-scroll"><div class="timeline">${axis}${rows}</div></div>
        <p class="daynote">${naam}: ${aanwezig} van ${withRooster.length} teamleden aanwezig in de praktijk.${
          opl.length ? ` Opleidingsdag aan de universiteit: ${opl.map(o => o.naam).join(", ")}.` : ""}</p>
      </div>`;
    };
    const rooster = `
      <div class="rooster">
        <div class="tabs" role="tablist" aria-label="Kies een dag">
          ${DAGEN.map(([k, naam], i) => `<button type="button" role="tab" id="tab-${k}" aria-controls="panel-${k}" aria-selected="${i === 0}" data-day="${k}">${naam}</button>`).join("")}
        </div>
        ${DAGEN.map(panel).join("")}
      </div>`;

    return `
      <p class="muted">Elk teamlid heeft een korte beschrijving en een persoonlijke werkagenda die je kunt openen. Het praktijkrooster toont per dag wie wat doet. 38 uur per week is voltijds; middagpauzes tellen niet mee in de uren.</p>
      ${TOOLBAR}
      <div class="legend" aria-label="Legende">${legend}<span class="blk t-pauze"><span class="lb">Middagpauze</span></span></div>
      <div class="accs">
        ${acc("Teamleden", `<ul class="team">${members}</ul>`, false, true)}
        ${acc("Praktijkrooster per dag", rooster, false, true)}
      </div>`;
  },
  populatie(p) {
    const d = p.populatie;
    const fmt = n => n.toLocaleString("nl-BE");
    const bars = rows => `<ul class="bars">${rows.map(r => `
        <li><span>${r.label}</span>
          <span class="track" role="presentation"><span class="fill" style="display:block;width:${r.pct}%"></span></span>
          <span class="pct">${fmt(r.pct)}%</span></li>`).join("")}</ul>`;
    const sec = acc;
    const groups = (d.indicatoren || []).map(g => sec(g.groep, `
        <ul class="ind">
          <li class="ind-head" aria-hidden="true"><span></span><span class="num">Aantal</span><span class="num">Aandeel</span></li>
          ${g.rijen.map(r => `
          <li><span>${r.label}<small>${r.noemer}</small></span><span class="num">${fmt(r.n)}</span><span class="num">${fmt(r.pct)}%</span></li>`).join("")}
        </ul>`, true)).join("");
    return `
      <div class="total"><strong>${fmt(d.totaal)}</strong><span>ingeschreven patiënten</span></div>
      ${TOOLBAR}
      <div class="accs">
        ${sec("Leeftijdsverdeling", bars(d.leeftijd))}
        ${sec("Kenmerken van de populatie", `<ul class="traits">${d.kenmerken.map(k => `<li><strong>${k.titel}</strong><span>${k.tekst}</span></li>`).join("")}</ul>`)}
        ${sec("Registratie en opvolging in het dossier", `<p class="muted">Cijfers uit het elektronisch patiëntendossier van de praktijk.</p>${groups}`)}
      </div>`;
  }
};

/* ---------- Weergave ---------- */
const app = document.getElementById("app");

function renderLanding() {
  document.title = "Dossiers huisartsenpraktijken";
  app.innerHTML = `
    <main class="landing">
      <h1>Dossiers huisartsenpraktijken</h1>
      <p class="intro">Kies een dossier om de visie, het team en de patiëntenpopulatie van een praktijk te bekijken.</p>
      <div class="cabinet">
        ${PRACTICES.map(p => `
          <a class="folder ${p.cls}" href="#/${p.id}" data-nav="/${p.id}">
            <span class="sheet"></span>
            <span class="body">
              <span class="label"><h2>${p.naam}</h2><span>${p.tagline}</span></span>
              <span class="open">Dossier openen</span>
            </span>
          </a>`).join("")}
      </div>
    </main>`;
  window.scrollTo(0, 0);
}

function renderDossier(p, topicId) {
  const topic = TOPICS.find(t => t.id === topicId) || TOPICS[0];
  document.title = `${topic.titel} – ${p.naam}`;
  app.innerHTML = `
    <div class="dossier ${p.cls}">
      <aside class="side">
        <a class="back" href="#/" data-nav="/">‹ Alle dossiers</a>
        <div>
          <h1>${p.naam}</h1>
          <p class="tagline">${p.tagline}</p>
        </div>
        <nav aria-label="Onderwerpen">
          <ul class="topics">
            ${TOPICS.map(t => `
              <li><a href="#/${p.id}/${t.id}" data-nav="/${p.id}/${t.id}" ${t.id === topic.id ? 'aria-current="page"' : ""}>${t.titel}</a></li>`).join("")}
          </ul>
        </nav>
      </aside>
      <main class="main">
        <div class="main-inner ${topic.id === 'team' || topic.ws ? 'wide' : ''}">
          <h2 tabindex="-1" id="topic-title">${topic.titel}</h2>
          ${RENDERERS[topic.id](p)}
        </div>
      </main>
    </div>`;
  window.scrollTo(0, 0);
  if (topic.ws) initWerkblad(p, topic.ws);
}

let currentPath = null;

function route(path) {
  if (path === undefined) path = location.hash.slice(1);
  currentPath = path;
  clearInterval(wbTimer);
  try {
    const [, id, topic] = path.split("/");
    const practice = PRACTICES.find(p => p.id === id);
    if (practice) renderDossier(practice, topic);
    else renderLanding();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="err"><h1>Er ging iets mis bij het laden van deze pagina</h1><p>${err && err.message ? err.message : err}</p><p><a href="#/" data-nav="/">Terug naar alle dossiers</a></p></div>`;
  }
}

function navigate(path) {
  try { history.pushState(null, "", "#" + path); } catch (e) { /* preview zonder history-toegang */ }
  route(path);
}

/* Eén klik-afhandelaar voor alles: werkt ook waar #-links geblokkeerd zijn. */
document.addEventListener("click", e => {
  const el = e.target.closest ? e.target : e.target.parentElement;
  if (!el) return;

  const indEl = el.closest("[data-ind-act]");
  if (indEl) { indActie(indEl); return; }

  const balEl = el.closest("[data-bal-act]");
  if (balEl) { balActie(balEl); return; }

  const wbEl = el.closest("[data-wb]");
  if (wbEl) { wbAction(wbEl.dataset.wb, wbEl.dataset.q); return; }

  const all = el.closest("[data-all]");
  if (all) {
    document.querySelectorAll(".main details").forEach(d => { d.open = all.dataset.all === "open"; });
    return;
  }

  const tab = el.closest("[data-day]");
  if (tab) {
    const box = tab.closest(".rooster");
    box.querySelectorAll("[data-day]").forEach(b => b.setAttribute("aria-selected", String(b === tab)));
    box.querySelectorAll("[role=tabpanel]").forEach(pn => { pn.hidden = pn.id !== "panel-" + tab.dataset.day; });
    return;
  }

  const link = el.closest("[data-nav]");
  if (!link) return;
  e.preventDefault();
  navigate(link.getAttribute("data-nav"));
});

/* Werkblad: een aangepast veld markeren, en Enter in het codeveld = ontgrendelen */
document.addEventListener("input", e => {
  if (!e.target.matches) return;
  if (e.target.matches(".wb-card textarea")) e.target.dataset.dirty = "1";
  if (e.target.id === "wb-naaminput") { wb.naam = e.target.value.trim(); wbStore.set("wb-naam", wb.naam); }
  if (e.target.dataset && (e.target.dataset.balF !== undefined || e.target.dataset.balR !== undefined)) balInput(e.target);
  if (e.target.dataset && e.target.dataset.indR !== undefined) indInput(e.target);
});
document.addEventListener("change", e => {
  if (e.target.matches && e.target.matches("[data-bal-team]")) { balTeamlid(e.target); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "wb-pwinput") wbAction("unlock");
});

/* Terugknop en handmatig aangepaste URL's */
const onUrlChange = () => { const h = location.hash.slice(1); if (h !== currentPath) route(h); };
window.addEventListener("popstate", onUrlChange);
window.addEventListener("hashchange", onUrlChange);
route();
</script>
